[project]
name = "mcp-db-chain-bridge"
version = "0.1.0"
description = "MCP server for reading local databases and executing on-chain transactions"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "web3>=7.0.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
db-chain-server = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
